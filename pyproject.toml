[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tn-highway-intel"
version = "0.1.0"
description = "Personal Tamil Nadu highway land-acquisition tracker"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "cryptography>=42.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.33",
    "folium>=0.16",
    "streamlit-folium>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
